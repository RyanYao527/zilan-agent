  - chunk_id: context:vipassana:work-feedback-debug
    chunk_type: context_topic
    source_file: context/南传观禅指南.md
    start_line: 246
    end_line: 266
    citation: "context/南传观禅指南.md:246-266"
    passage_citation: "context/南传观禅指南.md:246-266"
    text: |-
      ① 名色分别（第一智）：
         "对方的批评或修正意见" = 声波（色法）
         "我的紧张" = 身体感受（色法）
         "知道被批评了" = 意识（名法）
         "觉得被否定了" = 想心所的归类动作（名法）
         → 这些都是名色法，没有"我"在其中。

      ② 缘摄受（第二智）：
         声波（缘）→ 耳识（识）→ 苦受（受）→ 归类为"否定"（想）→ 瞋生起（心所）
         → 没有"我"在推动这条链，是自动运行的。

      ③ 三相印证（第三智）：
         "这种难受的感觉，会永远持续吗？" → 不，它正在变化。
         "我能控制它不出现吗？" → 不——控制本身就是妄想。
         → 它是无常的、被生灭逼迫的（苦）、不可控的（无我）。
    metadata:
      topics:
        - 观禅 Debug
        - 名色分别
        - 缘摄受
        - 三相印证
      reasoning_roles:
