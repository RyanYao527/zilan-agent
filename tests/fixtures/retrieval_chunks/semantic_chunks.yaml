    passage_citation: "《長阿含經》(T01n0001) 卷 10, （一三）佛說長阿含第二分大緣方便經第九, context/agama/T0001-chang-agama.md:3997"
    text: "「阿難！彼見我者，言受是我，當語彼言：『如來說三受，樂受、苦受、不苦不樂受。當有樂受時，無有苦受、不苦不樂受；有苦受時，無有樂受、不苦不樂受；有不苦不樂受時，無有苦受、樂受。』所以然者？阿難！樂觸緣生樂受，若樂觸滅受亦滅。阿難！苦觸緣生苦受，若苦觸滅受亦滅；不苦不樂觸緣生不苦不樂受，若不苦不樂觸滅受亦滅。阿難！如兩木相攢則有火生，各置異處則無有火。此亦如是，因樂觸緣故生樂受，若樂觸滅受亦俱滅；因苦觸緣故生苦受，若苦觸滅受亦俱滅；因不苦不樂觸緣生不苦不樂受，若不苦不樂觸滅受亦俱滅。阿難！此三受有為無常，從因緣生，盡法、滅法，為朽壞法。彼非我有，我非彼有，當以正智如實觀之。阿難！彼見我者，以受為我，彼則為非。"
