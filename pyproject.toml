[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zilan-agent"
version = "2.5.1"
description = "Validation helpers and API harness for the Zilan Buddhist agent corpus."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=7.4,<8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools]
py-modules = []

[tool.mypy]
python_version = "3.11"
files = ["scripts"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = true
disable_error_code = ["import-untyped"]

# Baseline-only overrides for legacy dynamic scripts; tighten these in later focused PRs.
[[tool.mypy.overrides]]
module = [
  "build_agama_context",
  "mock_install_smoke",
  "openai_api_harness",
  "search_agama",
  "validate_zilan_repo",
]
disable_error_code = ["assignment", "attr-defined", "operator", "union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--cov=scripts --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["scripts/**/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_agama_context.py" = ["E501"]
