[build-system]
requires = ["setuptools>=69", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "zilan-agent"
version = "2.5.6"
description = "Deterministic output-contract validators for LLM responses + Buddhist philosophy Agent/Skill framework."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
  "llm",
  "prompt-engineering",
  "output-validation",
  "deterministic-testing",
  "contract-testing",
  "buddhism",
  "claude-code",
  "agent",
]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Religion",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Religion",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/RyanYao527/zilan-agent"
Repository = "https://github.com/RyanYao527/zilan-agent"
Issues = "https://github.com/RyanYao527/zilan-agent/issues"
Changelog = "https://github.com/RyanYao527/zilan-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["mypy>=1.10,<2.0", "pytest>=7.4,<8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
zilan-contract = "zilan_contract.cli:main"

[tool.setuptools]
py-modules = []
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = [".", "scripts"]
include = ["zilan_contract*", "zilanlib*"]

[tool.setuptools.package-data]
zilanlib = ["py.typed"]
zilan_contract = ["py.typed", "fixtures/*.yaml", "fixtures/**/*.yaml", "fixtures/**/*.md"]

[tool.mypy]
python_version = "3.11"
files = ["scripts", "zilan_contract"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = true
disable_error_code = ["import-untyped"]

# Baseline-only overrides for legacy dynamic scripts; tighten these in later focused PRs.
[[tool.mypy.overrides]]
module = [
  "build_agama_context",
  "mock_install_smoke",
  "openai_api_harness",
  "search_agama",
  "validate_zilan_repo",
]
disable_error_code = ["assignment", "attr-defined", "operator", "union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--cov=scripts/zilanlib --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["scripts/**/*.py", "tests/*.py", "zilan_contract/**/*.py"]

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_agama_context.py" = ["E501"]
