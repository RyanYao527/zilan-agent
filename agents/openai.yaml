# ── 工具绑定 ──────────────────────────────────────────

tools:
  required:
    - name: read_file
      description: 读取 context 文件和阿含经文本
    - name: search_content
      description: 在阿含经全文中搜索关键词
    - name: list_directory
      description: 浏览 context 目录结构

  optional:
    - name: web_search
      description: 查找 CBETA 在线经文、学术论文
    - name: web_fetch
      description: 获取在线经文全文和学术资料
    - name: execute_command
      description: 运行 build_agama_context.py 重建文本
    - name: write_file
      description: 输出长篇分析报告

# ── 参数推荐 ──────────────────────────────────────────

parameters:
  temperature: 0.3
  max_tokens: 4096
  top_p: 0.9

# ── 知识库路径 ────────────────────────────────────────

knowledge_base:
  root: "context/"
  files:
    - path: "摄类学工具箱.md"
      trigger: "概念辨析 / 范畴关系 / 定义校验 / 论证有效性"
    - path: "因明推理引擎.md"
      trigger: "推理验证 / 因三相 / 三因说 / 论式构建"
    - path: "心类学认知分析.md"
      trigger: "心识运作 / 烦恼对治 / 认知正确性 / 量与非量"
    - path: "中观应成精要.md"
      trigger: "空性 / 无我 / 缘起 / 二谛 / 中观"
    - path: "南传观禅指南.md"
      trigger: "止观 / 正念 / 禅修 / 十六观智"
    - path: "模因机器视角下的佛教结集与传播.md"
      trigger: "结集 / 传播史 / 本土化 / 数字佛教 / 模因"
    - path: "agama/agama-index.md"
      trigger: "阿含经文本引用 / 经文检索"

policy:
  allow_implicit_invocation: true
  codex_subagent_invocation: "Use Codex sub-agent spawning only when the user explicitly asks for spawn / sub-agent / independent deep research, or after the user confirms the recommendation."
  require_citation: true
  citation_format: "《经名》(CBETA编号) 卷X/经号或品名，local-file.md:line"
  agama_evidence_contract: "阿含证据回答必须说明检索范围，使用 CBETA 编号和 context/agama/ 本地锚点，标明代表性命中，并保留字面短语“待校勘”；不得暗示本地检索已经达到出版级校勘、无需再校、全量穷尽或可充当定本文本，即便是否定句也不要复用这类浅层禁词字样；推荐边界句为“初步检索完成，仍待校勘；未作校勘定案，不能作为定本使用”；无我/非我主题可得时至少包含一条《雜阿含經》(T02n0099) 代表引用。"
  madhyamaka_prasanga_contract: "中观应成回答必须区分对方承许与自身边界，保留 自性有、归谬、缘起、矛盾、不立自宗 等关键节点；涉及无我、空性或缘起时，还必须显式保留断灭边界并逐字写出短语`只破自性有`（不要用加粗、引号或空格拆开）：中观只破自性有，不破世俗缘起安立；把空性理解为断灭或因果不存在是不成立的误读；以二谛说明胜义无自性、世俗可安立因果作用；不得把应成法写成正面建立自宗，也不得把空性表达成一切法在任何层面都不存在。"
  cognitive_practice_boundary_contract: "心类学与观禅实修边界回答必须显式保留 心类学、触、作意、受、想、思、颠倒知、犹豫识、比量、念、慧、无瞋、行舍、名色分别、缘摄受、三相印证、边界、非心理治疗、善知识指导；不得用“善心所”等概括替代 念、慧、无瞋、行舍；不得表述为保证疗愈、等同心理治疗、已证观智、无需善知识或医疗/心理健康处置；边界句优先使用“非心理治疗”“专业心理支持”“善知识指导”。"
  boundary_statement: "止观实修需在善知识指导下进行；模因分析不替代义理判教"
